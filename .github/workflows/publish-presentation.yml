name: Publish product presentation

on:
  push:
    branches: [main]
    paths:
      - product-presentation.html
      - docs/architecture/production-aws-eks-architecture.png
      - .github/workflows/publish-presentation.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static Pages artifact
        shell: bash
        run: |
          mkdir -p site/docs/architecture
          cp product-presentation.html site/index.html
          cp docs/architecture/production-aws-eks-architecture.png site/docs/architecture/
          cp -R docs/presentation site/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
